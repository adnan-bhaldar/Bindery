<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>Bindery – Modern Image to PDF Web App</title>
  <meta name="description"
    content="Import, arrange, edit, and export beautiful PDFs directly in your browser. Fast, offline-first, and available in Light & Dark themes." />
  <meta name="keywords"
    content="Bindery,image to pdf,pdf converter,pdf editor,images to pdf,offline pdf,pdf maker,browser pdf,web app" />
  <meta name="author" content="Bindery" />
  <meta name="robots" content="index,follow" />
  <meta name="referrer" content="origin-when-cross-origin" />

  <!-- Canonical -->
  <link rel="canonical" href="https://bindery.vercel.app/" />

  <!-- Theme -->
  <!-- <meta name="theme-color" content="#6366f1" /> -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d14" />

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bindery" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bindery" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://bindery.vercel.app/" />
  <meta property="og:title" content="Bindery – Modern Image to PDF Web App" />
  <meta property="og:description"
    content="Import, arrange, edit, and export beautiful PDFs directly in your browser. Fast, offline-first, and available in Light & Dark themes." />
  <meta property="og:image" content="https://bindery.vercel.app/og-image.webp" />
  <meta property="og:image:secure_url" content="https://bindery.vercel.app/og-image.webp" />
  <meta property="og:image:type" content="image/webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Bindery preview showing Light and Dark themes" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bindery – Modern Image to PDF Web App" />
  <meta name="twitter:description"
    content="Import, arrange, edit, and export beautiful PDFs directly in your browser. Fast, offline-first, and available in Light & Dark themes." />
  <meta name="twitter:image" content="https://bindery.vercel.app/og-image.webp" />
  <meta name="twitter:image:alt" content="Bindery preview showing Light and Dark themes" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Prevent FOUC by applying theme immediately -->
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("bindery:theme");
        const parsed = stored ? JSON.parse(stored) : null;
        const theme = parsed?.state?.theme ?? "system";
        const resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
            : theme;
        document.documentElement.classList.add(`theme-${resolved}`);
      } catch {
        document.documentElement.classList.add("theme-dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
